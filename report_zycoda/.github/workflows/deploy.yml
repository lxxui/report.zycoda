name: Deploy ZYCODA to AWS

on:
  push:
    branches: [ main ] # ถ้าฝ้ายใช้ชื่อ branch อื่น เช่น master ให้แก้เป็น master นะครับ

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 18.141.239.137
          username: Administrator
          password: r!D!N0-vBrRDZ1UZM-N7Y-&(Cyor2.Lm # รหัสผ่านเครื่อง AWS
          port: 22
          script: |
            cd C:\inetpub\wwwroot
            # ตรวจสอบว่ามีโฟลเดอร์ zycoda หรือยัง ถ้าไม่มีให้สร้าง
            if (!(Test-Path zycoda)) { New-Item -ItemType Directory -Name zycoda }
            cd zycoda
            # สั่งให้ Server ดึงไฟล์ล่าสุดจาก GitHub (ต้องทำ Git Clone ใน Server ครั้งแรกก่อน)
            git pull origin main